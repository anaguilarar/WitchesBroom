general_info:
  n_cores: 1
  output_path: "outputs/climate_indices" 
  spatial_data_path: "outputs/spatial_data/spatial_data_unique_collection_coords_gridcell_2024_phil.parquet"
  year_oi: 2024

# Environmental input and processing settings (ClimateConfig)
climate_config:
  climate_data_path: "outputs/climate_data/weather_phl_2024_2023_2024.nc" # Root path to climate grids
  
  # List of complex climate indices to calculate (List[ClimateIndex])
  indices:
    - name: "vpd_lt_20"
      description: "Vapor Pressure Deficit lower than 2.0 kPa — disease-favorable humidity window; VPD < 2.0 kPa captures wet-season and shoulder-season days where leafhopper feeding and phytoplasma inoculation are promoted"
      meteorological_variables:
        - "vpd"
      parameters:
        threshold: 2.0

    - name: "n_wet_spells"
      description: "Number of wet spells based on precipitation threshold and minimum duration"
      meteorological_variables:
        - "precipitation"
      parameters:
        thresh: 1.0
        min_duration_days: 5

    - name: "n_dry_spells"
      description: "Number of dry spells (<1 mm/d) lasting >=7 consecutive days — cassava drought-immune suppression onset threshold (Euphytica 2017, Plants 2024)"
      meteorological_variables:
        - "precipitation"
      parameters:
        thresh: 1.0
        min_duration_days: 7

    - name: "avg_wet_spell_duration"
      description: "Average duration of observed wet spells"
      meteorological_variables:
        - "precipitation"
      parameters:
        thresh: 1.0
        min_duration_days: 5

    - name: "max_hr_days"
      description: "Days with mean daily RH >= 80% — broad disease-favorable humidity (README rationale; 85% overly restrictive for tropical systems)"
      meteorological_variables:
        - "dailyhr"
      parameters:
        thresh: 80

    - name: "max_hr06_days"
      description: "Count of days where relative humidity exceeds threshold limits"
      meteorological_variables:
        - "rh06"
      parameters:
        thresh: 85

    - name: "max_hr12_days"
      description: "Days with 12:00 RH >= 70% — low midday leafhopper activity (stomatal closure); 85% overly restrictive at peak VPD hour (Sci.Rep 2018)"
      meteorological_variables:
        - "rh12"
      parameters:
        thresh: 70

    - name: "max_hr09_days"
      description: "Count of days where relative humidity exceeds threshold limits"
      meteorological_variables:
        - "rh09"
      parameters:
        thresh: 85

    - name: "max_hr15_days"
      description: "Days with 15:00 RH >= 70% — afternoon low vector activity window; aligns with diurnal leafhopper activity cycle (Sci.Rep 2018)"
      meteorological_variables:
        - "rh15"
      parameters:
        thresh: 70

    - name: "max_hr18_days"
      description: "Count of days where relative humidity exceeds threshold limits"
      meteorological_variables:
        - "rh18"
      parameters:
        thresh: 85
    
    - name: "canopy_wetness_duration"
      description: "Mean hours/day with RH >= 85% (linearly interpolated across 06/09/12/15/18h observations + 12h nighttime gap) — sustained leaf-wetness window for leafhopper feeding and phytoplasma inoculation; analogous phytoplasma diseases show epidemic acceleration at CWD >= 8-10 h/day"
      meteorological_variables:
        - "rh06"
        - "rh09"
        - "rh12"
        - "rh15"
        - "rh18"
      parameters:
        rh_threshold: 85.0

    - name: "consecutive_dry_days"
      description: "Maximum number of consecutive dry days below precipitation threshold"
      meteorological_variables:
        - "precipitation"
      parameters:
        thresh: 1.0

    - name: "growing_degree_days"
      description: "GDD above 10 deg C base — FAO tropical crop standard; aligns with cassava growth cessation and Cicadellidae development threshold (FAO GAEZ)"
      meteorological_variables:
        - "tmean"
      parameters:
        base_temperature: 10

    - name: "heat_wave_duration"
      description: "Days with tmax > 35 deg C for >=5 consecutive days — cassava photosynthesis decline onset; leafhopper reproduction failure above this threshold (Front.PlantSci 2023, Sci.Rep 2018)"
      meteorological_variables:
        - "tmax"
      parameters:
        thresh: 35
        min_duration_days: 5

    - name: "cold_wave_duration"
      description: "Days with tmin < 18 deg C for >=5 consecutive days — cassava root development minimum; leafhopper reproduction and phytoplasma replication suppressed below this threshold (Plants 2022, Sci.Rep 2018)"
      meteorological_variables:
        - "tmin"
      parameters:
        thresh: 18
        min_duration_days: 5

    - name: "cool_night_frequency"
      description: "Mean count of cool nights (tmin < 15 deg C) per rolling 10-day window — highland leafhopper development suppressor; frequent sub-15 deg C nights reduce population growth rate even when daytime temperatures are favorable; high CMF also correlates with dawn dew formation and sustained RH >= 90% at 06:00 (Sci.Rep 2018)"
      meteorological_variables:
        - "tmin"
      parameters:
        threshold: 15.0
        window: 10
        aggregation: "mean"

    - name: "daily_intensity_index"
      description: "Daily precipitation intensity index"
      meteorological_variables:
        - "precipitation"
      parameters:
        thresh: 1.0

  # List of basic descriptive stats to run (List[ClimateSummarisation])
  summarizations:
    - meteorological_variable: "tmax"
      description: "Mean maximum temperature during the time window"
      summary_function: "mean" 
      parameters: null

    - meteorological_variable: "tmin"
      description: "Mean minimum temperature during the time window"
      summary_function: "mean" 
      parameters: null

    - description: "Mean temperature during the time window"
      meteorological_variable: "tmean"
      summary_function: "mean" 
      parameters: null

    - description: "Averaged rh06 relative humidity"
      meteorological_variable: "rh06"
      summary_function: "mean"
      parameters: null

    - description: "Averaged rh09 relative humidity"
      meteorological_variable: "rh09"
      summary_function: "mean"
      parameters: null

    - description: "Averaged rh12 relative humidity"
      meteorological_variable: "rh12"
      summary_function: "mean"
      parameters: null

    - description: "Averaged rh15 relative humidity"
      meteorological_variable: "rh15"
      summary_function: "mean"
      parameters: null

    - description: "Averaged rh18 relative humidity"
      meteorological_variable: "rh18"
      summary_function: "mean"
      parameters: null

    - description: "Accumulated Vapor Pressure Deficit values"
      meteorological_variable: "vpd"
      summary_function: "sum"
      parameters: null

    - description: "Accumulated precipitation (Total Rainfall)"
      meteorological_variable: "precipitation"
      summary_function: "sum"
      parameters: null

    - desciption: "Accumulated evapotranspiration"
      meteorological_variable: "etr"
      summary_function: "sum"
      parameters: null

    - description: "Accumulated incoming solar radiation"
      meteorological_variable: "srad"
      summary_function: "sum"
      parameters: null

# Trial locations and temporal alignments (DataSummarizationConfig)
data_summarization:
  field_data_source: "outputs/spatial_data/spatial_data_unique_collection_coords_gridcell_2024_phil.parquet"
  output_filename: "extracted_climate_data_phl_2024.csv"
  column_starting_date: null
  column_ending_date: "collection_date"            # Column mapping the end of the experimental event
  temporal_window: 6                            # Evaluates a 6-month aggregate window
  nmonths_lookahead: 0                          # Calculates metrics 0 months into the future
  nmonths_lookback: 3
